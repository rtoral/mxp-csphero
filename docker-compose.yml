# Shared app configuration used by both the web and worker containers.
# They run the same image and need identical env (DB creds, secrets, SMTP).
# Values are pulled from .env (see .env.example / README) — no secrets are
# hardcoded here.
x-app-env: &app-env
  RAILS_ENV: production
  NODE_ENV: production
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-csphero_production}
  DB_USERNAME: ${DB_USERNAME:-csphero}
  DB_PASSWORD: ${DB_PASSWORD}
  # Public URL used in confirmation / password-reset email links.
  APP_HOST: ${APP_HOST:-localhost}
  APP_PROTOCOL: ${APP_PROTOCOL:-http}
  # Auth0 tenant/API used to verify the bearer tokens the frontend sends.
  # VITE_AUTH0_* counterparts are NOT set here — Vite bakes those into the
  # static JS bundle at image build time (see build.args below), so they
  # must be passed as --build-arg / build args, not as runtime env here.
  AUTH0_DOMAIN: ${AUTH0_DOMAIN}
  AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
  # SMTP — works with any provider (Mailgun, Postmark, SES, plain SMTP, ...).
  # Leave SMTP_ADDRESS unset/empty to disable outbound email entirely.
  SMTP_ADDRESS: ${SMTP_ADDRESS:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
  SMTP_STARTTLS_AUTO: ${SMTP_STARTTLS_AUTO:-true}
  MAILER_SENDER: ${MAILER_SENDER:-CSP Hero <no-reply@example.com>}

# Built once, reused by web/worker/migrate so we don't rebuild the image
# three times for the same code.
x-app-build: &app-build
  context: .
  args:
    VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
    VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
    VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}

services:
  # One-shot migration step. Runs db:prepare exactly once per `up`/deploy, then
  # exits. web and worker wait for it to complete successfully before starting,
  # so multiple app pods never race to migrate the same database. In Kubernetes
  # this maps to an init container or a pre-deploy Job.
  migrate:
    build: *app-build
    image: csphero:local
    command: ["./bin/rails", "db:prepare"]
    environment:
      <<: *app-env
    depends_on:
      - db
    restart: on-failure

  web:
    build: *app-build
    image: csphero:local
    environment:
      <<: *app-env
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Solid Queue worker: parses incoming CSP reports asynchronously so the web
  # tier can accept report beacons with a single cheap insert. Scale with
  # `docker compose up --scale worker=N` and tune threads/processes per worker
  # via JOB_CONCURRENCY (see config/queue.yml).
  worker:
    build: *app-build
    image: csphero:local
    command: ["./bin/jobs"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${DB_NAME:-csphero_production}
      - POSTGRES_USER=${DB_USERNAME:-csphero}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data:
